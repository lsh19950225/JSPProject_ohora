<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{/OJM/layout}">
<div layout:fragment="content">

<div class="container mt-5">
	<!-- 레스토랑 정보 테이블 -->
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>레스토랑 이름</th>
                <th>주소</th>
                <th>카테고리</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td th:text="${restaurent.rname}"></td>
                <td th:text="${restaurent.raddr}"></td>
                <td th:text="${restaurent.rcategory}"></td>
            </tr>
        </tbody>
    </table>
    <br />
    <br />

    <!-- 평균 별점 및 좋아요 비율 표시 -->
    <div class="mb-4">
        <table class="table table-striped table-bordered">
            <thead class="thead-dark">
                <tr>
                    <th>평균 별점</th>
                    <th>좋아요 비율</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <span>★</span>
                        <b id="avgRate" th:text="${restaurent.avgrating ?: 0}"></b>
                    </td>
                    <td>
                        <b id="likeRate"></b><span> 의 회원이 좋아합니다.</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <br />
    <br />

    <!-- 별점 백분율 계산 스크립트 -->
    <script>
        let avgrating = parseFloat(document.getElementById("avgRate").textContent);
        let percentage = avgrating ? (avgrating / 5) * 100 : 0;
        let roundedPercentage = Math.floor(percentage);
        document.getElementById("likeRate").textContent = roundedPercentage + "%";
    </script>

    <!-- 별점 카운트 테이블 -->
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>별점</th>
                <th>개수</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>★5</td>
                <td th:text="${ratingCounts[5]}"></td>
            </tr>
            <tr>
                <td>★4</td>
                <td th:text="${ratingCounts[4]}"></td>
            </tr>
            <tr>
                <td>★3</td>
                <td th:text="${ratingCounts[3]}"></td>
            </tr>
            <tr>
                <td>★2</td>
                <td th:text="${ratingCounts[2]}"></td>
            </tr>
            <tr>
                <td>★1</td>
                <td th:text="${ratingCounts[1]}"></td>
            </tr>
        </tbody>
    </table>
    <br />
    <br />

    <!-- 리뷰 테이블 -->
    <table class="table table-striped table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>작성자</th>
                <th>내용</th>
                <th>별점</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="list : ${restaurent.reviewList}">
                <td th:text="${list.userName}"></td>
                <td th:text="${list.content}"></td>
                <td th:text="|★${list.rating}|"></td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Bootstrap JS, Popper.js, and jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</div>
</html>
