<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{/OJM/layout}">

  <div layout:fragment="content" class="">

     <div class="container2">        
       <div class="content">
          <div class="map">
            <div class="place-autocomplete-card" id="place-autocomplete-card">
              <p>Search for a place here:</p>
            </div>
            <div id="map"></div>
            
          </div>     
          
          

          
<!-- 리뷰 -->
<div class="right">
<!-- 리뷰 보기 버튼 -->
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-auto">
            <a href="javascript:void(0);" id="reviewBtn" class="btn btn-primary btn-lg">
                <h4 class="text-center">리뷰 보기</h4>
            </a>
        </div>
    </div>
    <form action="/rank/reviewBtn" method="get" id="formReviewBtn">
        <input type="hidden" id="restaurentId" name="restaurentId" />
    </form>
</div>

<!-- 오점뭐 버튼 -->
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-auto">
            <a href="javascript:void(0);" id="OJMBtn" class="btn btn-warning btn-lg">
                <h4 class="text-center">오점뭐</h4>
            </a>
        </div>
    </div>
    <h1 id="jackpot" class="text-center mt-3"></h1>
</div>

<div id="isLogin" style="display: none;" th:text="${isLoggedIn}" ></div>
<div class="zzzzz"  th:each="r : ${t10}"  style="display: none;">
	<div class="top10s">
    	<div class="rname" th:text="${r.rname}"></div>
    	<div class="raddr" th:text="${r.raddr}"></div>
    	<div class="lat" th:text="${r.lat}"></div>
    	<div class="lng" th:text="${r.lng}"></div>
    	<div class="avgrating" th:text="${r.avgrating}"></div>
	</div>	
</div>

<script>
    $("#reviewBtn").on("click", function(e) {
        e.preventDefault(); // 기본 동작 방지

        let restaurentId = $("#restaurentId").val(); // restaurentId 값 확인

        if (!restaurentId) {
            alert("검색 후 사용하실 수 있습니다."); // 값이 없으면 경고 메시지 띄우기
            return; // 이벤트 발생 방지
        }

        // 값이 있을 때만 폼 제출
        $("#formReviewBtn").submit();
    });

    $("#OJMBtn").on("click", function(e) {
        e.preventDefault();

        $.ajax({
            url: "/OJM/button",
            type: "GET",
            success: function(data) {
                if (data) {
                    alert(data.rname);
                    $("#jackpot").text(data.rname);
                } else {
                    alert("식당 정보를 가져올 수 없습니다.");
                }
            },
            error: function() {
                alert("등록된 레스토랑이 없습니다.");
            },
        });
    });
</script>
</div>

        let map;

        async function initMap() {
          // Request needed libraries.
          //@ts-ignore
          const [{ Map }, { AdvancedMarkerElement }] = await Promise.all([
            google.maps.importLibrary("marker"),
            google.maps.importLibrary("places"),
          ]);
      
          // Initialize the map.
          map = new google.maps.Map(document.getElementById("map"), {
            center: { lat: 37.499294, lng: 127.03318829999999 },
            zoom: 16,
            mapId: "4504f8b37365c3d0",
            mapTypeControl: false,
          });
      
          //@ts-ignore
          const placeAutocomplete = new google.maps.places.PlaceAutocompleteElement();
      
          //@ts-ignore
          placeAutocomplete.id = "place-autocomplete-input";
      
          const card = document.getElementById("place-autocomplete-card");
      
          //@ts-ignore
          card.appendChild(placeAutocomplete);
          map.controls[google.maps.ControlPosition.TOP_LEFT].push(card);
      
          // Create the marker and infowindow
          marker = new google.maps.marker.AdvancedMarkerElement({
            map,
          });
          infoWindow = new google.maps.InfoWindow({});
      
          // Add the gmp-placeselect listener, and display the results on the map.
          //@ts-ignore
          placeAutocomplete.addEventListener("gmp-placeselect", async ({ place }) => {
            await place.fetchFields({
              fields: ["displayName", "formattedAddress", "location"],
            });
      
            // If the place has a geometry, then present it on a map.
            if (place.viewport) {
              map.fitBounds(place.viewport);
            } else {
              map.setCenter(place.location);
              map.setZoom(17);
            }
      
            console.log(place.toJSON());
            console.log("디스플레이 네임  " + place.displayName);
            console.log("ID  " + place.id);
            console.log("좌표  " + place.location);
            console.log("주소  " + place.formattedAddress);
           
            let rId = place.id;
            let displayName = place.displayName;
            let address = place.formattedAddress;
            let lat= place.toJSON().location.lat;
            let lng= place.toJSON().location.lng;
            
            $("#restaurentId").val(rId); // 추가
            
            console.log("좌표 위도  " + lat);
			
			let isLogin = $("#isLogin").text()
			console.log("로그인?" + isLogin)
			
			let content =
			  '<div id="infowindow-content">' +
			  '<span id="place-displayname" class="title"><b>' +
			  place.displayName +
			  "</b></span><br />" +
			  '<span id="place-address">' +
			  place.formattedAddress +
			  "</span>" +
			  "</div>" +
			  "<br><b>";
				
			if(isLogin === "true") {
			content +='<a th:href="@{/review/write}" id="revWrite">리뷰쓰기</a>';
			}
			console.log("컨텐츠"+content)
              
				//'<a href="" id="revWrite">리뷰쓰기</a>';
			  
            updateInfoWindow(content, place.location);
            marker.position = place.location;
   
            // 리뷰 작성 클릭시
    		
    		let popupWindow = null;
    		
    	    $(document).on('click', '#revWrite', function(e) {
    	        e.preventDefault();
    	        console.log("디스플레이 네임  " + place.displayName);
    	        let openUrl = "/review/write?rId="+rId+"&rName="+ displayName + "&rAddr="+address+"&lat="+lat+"&lng="+lng;
    		    //alert(openUrl)
    		    let popOption = "width=485px, height=490px, scrollbars=no";
    		
    		    // 팝업이 이미 열려 있다면 focus
    		    if (popupWindow && !popupWindow.closed) {
    		        popupWindow.focus();
    		    } else {
    		        popupWindow = window.open(openUrl, "리뷰 작성하세요", popOption);
    		    }
    	
    	    });
    		
          });
        }

        
        // Helper function to create an info window.
        function updateInfoWindow(content, center) {
          infoWindow.setContent(content);
          infoWindow.setPosition(center);
          infoWindow.open({
            map,
            anchor: marker,
            shouldFocus: false,
          });
        }
      
        initMap();
      </script>
