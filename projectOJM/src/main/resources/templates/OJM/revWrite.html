<style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
      display: flex;
     min-height: 100vh;
    }
    .review-form-container {
      width: 100%;
      max-width: 600px;
      background: #fff;
      padding: 20px;
      margin-left: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .review-form-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    .review-form-container textarea {
      width: 100%; /* 가로 100% */
      max-width: 500px; /* 최대 너비 제한 */
      height: 200px;
      margin: 0 auto; /* 가로 중앙 정렬 */
      display: block; /* 중앙 정렬을 위해 block으로 변경 */
      
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: none;
      font-size: 14px;
    }
    .review-form-container input[type="file"] {
      display: block;
      margin: 15px auto;
    }
    .review-form-container input[type="submit"] {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .review-form-container input[type="submit"]:hover {
      background-color: #45a049;
    }
    .hidden-input {
      display: none;
    }
  </style>
    <style>
     /* 전체를 중앙에 정렬 */
          .rating {
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .rating {
            display: inline-block;
            direction: rtl; /* 오른쪽에서 왼쪽으로 방향 지정 */
        }
        .rating input[type="radio"] {
            display: none; /* 라디오 버튼 숨기기 */
        }
        .rating label {
            font-size: 3rem; /* 별 크기 */
            color: #ccc; /* 기본 회색 */
            cursor: pointer;
            transition: color 0.3s ease; /* 색상 전환 애니메이션 */
        }
        /* 클릭된 별과 그 왼쪽 별을 금색으로 */
        .rating input[type="radio"]:checked ~ label {
            color: gold;
        }

        /* 마우스 오버 시 해당 별과 왼쪽 별들을 금색으로 */
        .rating label:hover,
        .rating label:hover ~ label {
            color: gold;
        }

        /* 선택된 별과 그 왼쪽 별을 금색으로 */
        .rating input[type="radio"]:checked + label,
        .rating input[type="radio"]:checked ~ label {
            color: gold;
        }
    </style>
   
   
</head>
<body>
<!-- <% Date writeDate = new Date(); %> -->
  <div class="review-form-container">
    <h2>리뷰 작성</h2>
    <form id="reviewWrite" action="" method="post" enctype="multipart/form-data">
       <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <textarea name="revContent" placeholder="리뷰 내용을 입력하세요" maxlength="200"></textarea>
     
     <!--
      <input id="attach" type="file" name="attach" multiple="multiple" accept="image/*">
    <p id="error-message" style="color: red; font-size:10px"></p>
    -->
      
      <input id="isPhoto" type="hidden" name="revIsphoto" value="" class="hidden-input">
 
       <div class="rating">
            <input type="radio" id="star5" name="revRating" value="5">
            <label for="star5">★</label>
            <input type="radio" id="star4" name="revRating" value="4">
            <label for="star4">★</label>
            <input type="radio" id="star3" name="revRating" value="3">
            <label for="star3">★</label>
            <input type="radio" id="star2" name="revRating" value="2">
            <label for="star2">★</label>
            <input type="radio" id="star1" name="revRating" value="1" checked="checked">
            <label for="star1">★</label>
        </div>
      

      
      <div class="cate">
                  <input type="radio" id="korea" name="rcate" value="한식">
                  <label for="korea">한식</label>
                  <input type="radio" id="china" name="rcate" value="중식">
                  <label for="china">중식</label>
                  <input type="radio" id="japan" name="rcate" value="일식">
                  <label for="japan">일식</label>
                  <input type="radio" id="america" name="rcate" value="양식">
                  <label for="america">양식</label>
                  <input type="radio" id="fastfood" name="rcate" value="패스트푸드">
                  <label for="fastfood">패스트푸드</label>            
                     
      </div><br>
       <input id="submitRV" type="submit" value="리뷰 등록">
    </form>
  </div>
</body>

<script type="text/javascript">
document.getElementById('submitRV').addEventListener('click', function (event) {
    // 카테고리 라디오 버튼 검사
    const selectedCategory = document.querySelector('input[name="rcate"]:checked');
    const fileInput = document.getElementById('attach');
    const maxFiles = 5; // 최대 파일 개수
    const errorMessage = document.getElementById('error-message');
    
    // 1. 카테고리 선택 여부 확인
    if (!selectedCategory) {
        event.preventDefault(); // 폼 전송 차단
        alert("카테고리를 선택해주세요!");
        return; // 추가 검사를 실행하지 않음
    }

    // 2. 파일 첨부 개수 확인
    if (fileInput && fileInput.files.length > maxFiles) {
        event.preventDefault(); // 폼 전송 차단
        errorMessage.textContent = `파일은 최대 ${maxFiles}개까지 업로드할 수 있습니다.`;
        fileInput.value = ""; // 파일 선택 초기화
        return;
    } else {
        errorMessage.textContent = ""; // 에러 메시지 초기화
    }

    // 3. 파일 첨부 여부에 따라 isPhoto 값을 설정
    const isPhotoInput = document.getElementById('isPhoto');
    if (fileInput && fileInput.files.length > 0) {
        isPhotoInput.value = "Y";
    } else {
        isPhotoInput.value = "N";
    }

    // 폼이 정상적으로 제출됨
});

</script>
</html>
